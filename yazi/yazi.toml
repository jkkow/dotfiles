[mgr]
ratio = [2, 3, 5]
sort_by = "natural"
linemode = "size"
show_hidden = false
show_symlink = true
sort_dir_first = true

[preview]
wrap = "yes"
tab_size = 2
max_width = 800
max_height = 600
cache_dir = ""
image_filter = "catmull-rom"
image_quality = 75

[opener]
edit = [{ run = "nvim %s", block = true, desc = "Neovim", for = "windows" }]
